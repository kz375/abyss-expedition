<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="深渊远征实时战斗完整测试版">
  <title>深渊流战 · 完整测试版</title>
  <link rel="stylesheet" href="/realtime-test/style.css">
  <script src="/realtime-test/campaign.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="beta-head"><p class="eyebrow" id="eyebrow">ABYSS FLOW COMBAT · COMPLETE WEB BETA</p><div class="beta-tools"><button id="language" type="button">EN</button><button id="codex" type="button">图鉴</button><button id="achievements" type="button">成就</button></div></div>
    <h1 id="title">深渊流战 · 八层远征测试</h1>
    <p class="sub" id="sub">完整独立测试版：所有战斗均为实时冷却制。它不读取、不修改正式远征存档。</p>
    <p class="notice" id="notice">测试目标：职业手感、怪物意图、技能冷却、异常状态、遗物/事件抉择与八层推关节奏。</p>
    <section class="arena" aria-label="实时战斗地牢">
      <div class="arena-head"><span id="floor-label">选择职业后开始</span><span id="flow"><i></i><span id="flow-text">战斗冻结</span></span></div>
      <div class="fighter player" id="player-card"><p class="role" id="hero-role">PLAYER</p><h2 id="hero-name">选择一名英雄</h2><span class="portrait" aria-hidden="true"></span><div class="meter"><b>生命</b><strong id="hero-hp-text">—</strong><div class="bar hp"><span id="hero-hp"></span></div><div class="bar shield"><span id="hero-shield"></span></div><em id="hero-shield-text">无护盾</em></div><div class="statuses" id="hero-status"></div><p class="passive" id="hero-passive">职业被动将在这里显示</p></div>
      <div class="impact" id="impact" aria-hidden="true">✦</div>
      <div class="fighter enemy" id="enemy-card"><p class="role" id="enemy-role">HOSTILE</p><h2 id="enemy-name">深渊正在等待</h2><span class="portrait" aria-hidden="true"></span><div class="meter"><b>生命</b><strong id="enemy-hp-text">—</strong><div class="bar hp"><span id="enemy-hp"></span></div><div class="bar shield"><span id="enemy-shield"></span></div><em id="enemy-shield-text">无护盾</em></div><div class="statuses" id="enemy-status"></div><div class="summons" id="summons" aria-live="polite"></div><p class="intent" id="intent">敌人尚未苏醒。</p></div>
      <div class="skills" id="skills" aria-label="技能栏"></div>
      <div class="overlay" id="overlay"></div>
    </section>
    <section class="below"><div class="journal" id="journal">[系统] 选择职业以开启完整实时远征测试。</div><div class="run-stats"><span id="gold">金币 0</span><span id="relics">遗物 0</span></div><button id="pause">暂停</button><button id="restart" class="danger">重新开始</button></section>
    <p class="fineprint">Beta 内容只在浏览器内存中运行。关闭或刷新页面即结束本次测试；正式网页与原存档保持原样。</p>
  </main>
</body>
</html>
